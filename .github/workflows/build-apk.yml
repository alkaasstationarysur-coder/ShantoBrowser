name: Build APK

# Run by hand: GitHub -> Actions -> "Build APK" -> Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check the signing password secret
        env:
          SHANTO_KEY_PASSWORD: ${{ secrets.SHANTO_KEY_PASSWORD }}
        run: |
          if [ -z "$SHANTO_KEY_PASSWORD" ]; then
            echo "::error::The secret SHANTO_KEY_PASSWORD is missing. Add it in Settings -> Secrets and variables -> Actions, then run again."
            exit 1
          fi

      # Files uploaded through the GitHub website lose the "executable" bit.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build signed release APK
        env:
          SHANTO_KEY_PASSWORD: ${{ secrets.SHANTO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShantoBrowser-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
